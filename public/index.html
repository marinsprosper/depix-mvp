<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DePix Pay</title><style>body{margin:0;background:#07131a;color:#edf6f8;font-family:system-ui}.box{max-width:520px;margin:32px auto;padding:24px;background:#102631;border-radius:18px}input,button{width:100%;box-sizing:border-box;padding:13px;margin:8px 0;border:1px solid #31505d;border-radius:9px;background:#0b1b23;color:#fff;font:inherit}button{background:#26ba8b;border:0;font-weight:700;cursor:pointer}.muted{color:#a7bec6}.card{margin-top:16px;padding:15px;border-radius:10px;background:#0b1b23;white-space:pre-wrap;word-break:break-word}.warn{color:#ffd071;font-size:14px}</style></head><body><main class="box"><h1 id="title">DePix Pay</h1><p class="muted">Gere um QR Pix para receber DePix na sua carteira.</p><form id="form"><label>Valor em reais<input id="amount" type="number" min="1" step="0.01" value="10" required></label><label>Endereço DePix (opcional)<input id="address" placeholder="lq1..., ark1... ou spark1..."></label><p class="warn">Cada QR é de uso único. Confirme os dados antes de gerar.</p><button>GERAR QR PIX</button></form><section class="card" id="result">Carregando configuração…</section></main><script>const result=document.querySelector('#result'),form=document.querySelector('#form');let config={};async function load(){config=await fetch('/api/config').then(r=>r.json());document.querySelector('#title').textContent=config.platformName;result.textContent=config.mode==='live'?'Pronto para gerar Pix.':'Modo sandbox: nenhum Pix real será criado.'}load();form.addEventListener('submit',async e=>{e.preventDefault();const amountInCents=Math.round(Number(document.querySelector('#amount').value)*100),depixAddress=document.querySelector('#address').value.trim();result.textContent='Criando pagamento…';const response=await fetch('/api/payments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({amountInCents,depixAddress})});const body=await response.json();if(!response.ok){result.textContent=`Erro: ${body.error}`;return}const p=body.payment;result.innerHTML=`Status: <b>${p.status}</b>\nID: ${p.id}\nValor: R$ ${(p.amountInCents/100).toFixed(2)}\n\nPix copia e cola:\n${p.qrCopyPaste||'Indisponível'}${p.qrImageUrl?`\n\nQR: ${p.qrImageUrl}`:''}`});</script></body></html>
