<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DePix → Stablecoin</title><style>body{font-family:system-ui;background:#07131a;color:#e9f4f6;margin:0}.box{max-width:540px;margin:32px auto;padding:24px;background:#102631;border-radius:18px}input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border-radius:9px;border:1px solid #31505d;background:#0b1b23;color:#fff}button{background:#26ba8b;font-weight:700;cursor:pointer}.muted{color:#9db3bc}.summary{background:#0b1b23;padding:14px;border-radius:10px;line-height:1.65}.warn{color:#ffc55c}</style></head><body><main class="box"><h1>DePix → USDT / USDC</h1><p class="muted">MVP em modo de teste — nenhum Pix é gerado.</p><form id="f"><input name="name" placeholder="Nome completo" required><input name="cpf" placeholder="CPF" required><input name="amountBrl" type="number" min="1" step="0.01" placeholder="Valor em R$" required><select name="asset"><option>USDT</option><option>USDC</option></select><select name="network"><option value="Liquid">Liquid</option></select><input name="wallet" placeholder="Carteira de destino" required><section class="summary" id="summary">Preencha o valor para ver a estimativa.</section><p class="warn">Envios blockchain podem ser irreversíveis. Confira rede e carteira.</p><button>GERAR PIX</button></form><pre id="out"></pre></main><script>const f=document.querySelector('#f'),s=document.querySelector('#summary'),o=document.querySelector('#out');async function q(){let d=Object.fromEntries(new FormData(f));if(!d.amountBrl)return;let r=await fetch('/api/quote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});if(!r.ok)return;let x=await r.json();s.innerHTML=`Valor: R$ ${d.amountBrl}<br>Comissão: R$ ${(x.feeCents/100).toFixed(2)}<br>Taxa de infraestrutura: R$ ${(x.providerFeeCents/100).toFixed(2)}<br>Valor líquido: R$ ${(x.netCents/100).toFixed(2)}<br>Cotação estimada: R$ ${x.rate.toFixed(2)}<br>Você recebe aproximadamente: <b>${x.estimatedCrypto.toFixed(4)} ${d.asset}</b>`}f.addEventListener('input',q);f.addEventListener('submit',async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));let r=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)});o.textContent=JSON.stringify(await r.json(),null,2)});</script></body></html>
