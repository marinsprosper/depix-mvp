<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DePix → Stablecoin</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#07131a;color:#e9f4f6}.wrap{max-width:720px;margin:auto;padding:36px 20px}.badge{display:inline-block;background:#173c39;color:#77e5c0;padding:7px 10px;border-radius:999px;font-size:13px}.card{margin-top:18px;background:#102631;border:1px solid #23414e;border-radius:18px;padding:24px;box-shadow:0 18px 42px #0004}h1{margin:12px 0 8px;font-size:34px}.muted{color:#a9c0c8}.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}label{display:grid;gap:6px;font-size:14px;color:#b9cbd1}input,select,button{width:100%;border-radius:10px;border:1px solid #31505d;background:#0b1b23;color:#fff;padding:13px;font:inherit}button{background:#26ba8b;border:0;font-weight:750;cursor:pointer;margin-top:16px}.quote{margin-top:16px;padding:16px;border-radius:12px;background:#0b1b23;line-height:1.7}.notice{margin-top:14px;color:#ffcf75;font-size:14px}.result{margin-top:14px;padding:14px;border-radius:10px;background:#173c39;color:#c9ffea;display:none}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:20px 14px}h1{font-size:28px}}
  </style>
</head>
<body><main class="wrap"><span class="badge">DEMONSTRAÇÃO • modo de teste</span><section class="card"><h1>DePix → USDT / USDC</h1><p class="muted">Simule uma cotação. Nenhum Pix, cripto ou dado real é processado nesta página.</p><form id="form"><div class="grid"><label>Valor em R$<input id="amount" type="number" min="1" value="100" step="0.01" required></label><label>Ativo<select id="asset"><option>USDT</option><option>USDC</option></select></label></div><div class="grid"><label>Rede<select id="network"><option>Liquid</option></select></label><label>Carteira de destino<input placeholder="Ex.: endereço da sua carteira" required></label></div><div class="quote" id="quote"></div><p class="notice">Envios em blockchain podem ser irreversíveis. Esta é somente uma prévia visual.</p><button type="submit">SIMULAR ORDEM</button></form><div class="result" id="result"></div></section></main><script>const amount=document.querySelector('#amount'),asset=document.querySelector('#asset'),quote=document.querySelector('#quote'),result=document.querySelector('#result');function calc(){const value=Math.max(0,Number(amount.value)||0),fee=value*.005,provider=.99,net=Math.max(0,value-fee-provider),rate=asset.value==='USDT'?5.55:5.57,crypto=net/rate;quote.innerHTML=`Valor: <b>R$ ${value.toFixed(2)}</b><br>Comissão: R$ ${fee.toFixed(2)}<br>Taxa de infraestrutura: R$ ${provider.toFixed(2)}<br>Valor líquido: R$ ${net.toFixed(2)}<br>Você receberia aproximadamente: <b>${crypto.toFixed(4)} ${asset.value}</b>`}amount.addEventListener('input',calc);asset.addEventListener('change',calc);document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();result.style.display='block';result.textContent='Simulação criada com sucesso. Nenhuma transação real foi realizada.'});calc();</script></body>
</html>
